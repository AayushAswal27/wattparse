raw_h5: data/raw/ukdale.h5

resample:
  period_s: 6
  max_gap_s: 180        # longer gaps stay NaN, never filled

# One split per appliance - the houses differ in what they recorded.
# House 5 is held out everywhere. See notebooks/01 for the availability matrix.
targets:
  kettle:
    train: [1, 2, 3, 4]
    test: [5]
  microwave:
    train: [1, 2, 4]
    test: [5]
  dish washer:
    train: [1, 2]
    test: [5]
  fridge freezer:
    train: [1]         # only house 1 and 5 have this label
    test: [5]
  washer dryer:
    train: [1]
    test: [5]
